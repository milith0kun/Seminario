chunking:
  prose_tokens_min: 250
  prose_tokens_max: 400
  overlap_tokens: 60
  glossary_mode: one_entry_per_chunk

retrieval:
  final_top_k: 5
  dense_top_k: 20
  bm25_top_k: 20
  dialect_filter: collao

embeddings:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  local_dir: modelos/embeddings/sentence-transformers__paraphrase-multilingual-MiniLM-L12-v2
  batch_size: 16


