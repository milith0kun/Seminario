server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nota: no se declara un bloque types{} propio para el .wasm — nginx
    # ya incluye "application/wasm" en su mime.types por defecto desde
    # 2021, y declarar un types{} a nivel server reemplazaría (no
    # complementa) todo el mapeo heredado, rompiendo el resto de archivos.

    # El service worker no debe quedar cacheado por el navegador/proxy:
    # si se sirve una versión vieja, la app no detecta actualizaciones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html también sin caché larga: es la puerta de entrada a la app,
    # y ahí vive el manifiesto de precache que el service worker usa para
    # saber qué versión de los assets debe traer.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets con hash en el nombre (_next/static/...): inmutables, caché larga.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
        application/wasm image/svg+xml;
    gzip_min_length 1024;

    # La app usa HashRouter (rutas tipo /#/settings): el navegador nunca
    # manda el fragmento después del "#" al servidor, así que en la
    # práctica solo se pide "/" — este fallback es solo por si alguien
    # llega con una ruta rara o directamente a un archivo que no existe.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
